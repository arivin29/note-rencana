<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="content-type" content="text/html; charset=UTF8">
	<title>Devetek Helios</title>
  <base href="/">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<meta content="IoT Management System - Monitor and control your devices" name="description">
  <meta content="Devetek" name="author">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#00acac">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Helios">
  <meta name="application-name" content="Devetek Helios">
  <meta name="msapplication-TileColor" content="#00acac">
  <meta name="msapplication-TileImage" content="assets/icons/icon-144x144.png">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-192x192.png">
</head>
<body detect-scroll (onScroll)="handleScroll($event)">
  <app-root>
    <!-- BEGIN #loader -->
		<div id="loader" class="app-loader">
			<span class="spinner"></span>
		</div>
		<!-- END #loader -->
  </app-root>
</body>
</html>
