<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00acac"/>
      <stop offset="100%" style="stop-color:#008888"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Sun symbol for Helios -->
  <circle cx="256" cy="256" r="80" fill="#fff" fill-opacity="0.95"/>
  <!-- Sun rays -->
  <g fill="#fff" fill-opacity="0.9">
    <rect x="246" y="100" width="20" height="50" rx="10"/>
    <rect x="246" y="362" width="20" height="50" rx="10"/>
    <rect x="100" y="246" width="50" height="20" rx="10"/>
    <rect x="362" y="246" width="50" height="20" rx="10"/>
    <rect x="145" y="145" width="20" height="50" rx="10" transform="rotate(45 155 170)"/>
    <rect x="347" y="145" width="20" height="50" rx="10" transform="rotate(-45 357 170)"/>
    <rect x="145" y="317" width="20" height="50" rx="10" transform="rotate(-45 155 342)"/>
    <rect x="347" y="317" width="20" height="50" rx="10" transform="rotate(45 357 342)"/>
  </g>
  <!-- Inner circle accent -->
  <circle cx="256" cy="256" r="50" fill="#00acac"/>
  <circle cx="256" cy="256" r="30" fill="#fff" fill-opacity="0.8"/>
</svg>
