<div class="m-app" [class.m-app--project]="nav === 'project'">
  <mobile-header [title]="title" [sub]="sub" [showBack]="showBack" [onProfile]="onProfile" (back)="back()"></mobile-header>
  <main class="m-content" [mPull]="pullHandler" [mPullEnabled]="pullEnabled">

  </main>
  <mobile-bottom-nav *ngIf="nav === 'global'"></mobile-bottom-nav>
</div>
