<header class="m-appbar">
  <button *ngIf="showBack" class="m-appbar__back" type="button" (click)="back.emit()" aria-label="Kembali" title="Kembali">
    <i class="fa fa-chevron-left"></i>
  </button>

  <span class="m-brand__mark" *ngIf="!showBack" aria-hidden="true"><i class="fa fa-droplet"></i></span>

  <div class="m-appbar__titles">
    <div class="m-appbar__title" *ngIf="title; else brand">{{ title }}</div>
    <ng-template #brand><span class="m-brand__name">Helio<span class="accent">s</span></span></ng-template>
    <div class="m-appbar__sub" *ngIf="sub">{{ sub }}</div>
  </div>

  <button class="m-iconbtn" type="button" (click)="goDesktop()" title="Tampilan Desktop" aria-label="Tampilan Desktop">
    <i class="fa fa-desktop"></i>
  </button>
  <a class="m-iconbtn" *ngIf="!onProfile" routerLink="/mobile/profile" title="Profil" aria-label="Profil">
    <i class="fa fa-user"></i>
  </a>
</header>
