<div class="m-app">
  <form class="m-login" #f="ngForm" (ngSubmit)="submit(f)">
    <m-panel class="m-login__card" tone="theme">
      <div class="m-login__logo">
        <div class="m-login__mark" aria-hidden="true">D</div>
        <div>
          <div class="name">Devetek Helios</div>
          <div class="sub">Smart Water IoT</div>
        </div>
      </div>

      <div class="m-login__err" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

      <label class="m-lbl" for="m-login-email">Email</label>
      <div class="m-field">
        <i class="bi bi-envelope" aria-hidden="true"></i>
        <input id="m-login-email" name="email" type="email" [(ngModel)]="email" placeholder="Email" required autocomplete="username">
      </div>
      <label class="m-lbl" for="m-login-pass">Kata sandi</label>
      <div class="m-field">
        <i class="bi bi-lock" aria-hidden="true"></i>
        <input id="m-login-pass" name="password" type="password" [(ngModel)]="password" placeholder="Kata sandi" required autocomplete="current-password">
      </div>

      <button class="m-btn m-btn--primary" style="margin-top:8px" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Masuk</span>
        <span *ngIf="loading"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i> Memproses…</span>
      </button>
    </m-panel>
  </form>
</div>
