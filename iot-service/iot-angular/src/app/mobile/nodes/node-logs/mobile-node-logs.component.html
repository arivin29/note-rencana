<m-panel *ngIf="loading" label="Log perangkat" icon="bi-journal-text" [pad]="true">
  <div class="m-skel"></div><div class="m-skel w-70"></div><div class="m-skel w-50"></div>
</m-panel>

<m-panel *ngIf="!loading && error" label="Log perangkat" icon="bi-journal-text" tone="danger">
  <div class="m-empty">
    <i class="bi bi-exclamation-triangle m-tx-danger" aria-hidden="true"></i>{{ error }}
    <div class="m-mt-3"><button class="m-btn m-btn--ghost m-btn--tap" type="button" (click)="load(true)">Coba lagi</button></div>
  </div>
</m-panel>

<m-panel *ngIf="!loading && !error && logs.length === 0" label="Log perangkat" icon="bi-journal-text">
  <div class="m-empty">Belum ada log</div>
</m-panel>

<div class="m-banner m-banner--warn" *ngIf="!loading && refreshError" role="status">
  <i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>{{ refreshError }}</span>
  <button class="m-banner__btn" type="button" (click)="load(false)">Coba lagi</button>
</div>
<div class="m-result-count" *ngIf="!loading && !error && logs.length > 0">{{ logs.length }} log terbaru · tarik ke bawah untuk memuat ulang</div>
<m-panel *ngIf="!loading && !error && logs.length > 0" label="Log perangkat" icon="bi-journal-text">
  <div class="m-list__item" *ngFor="let l of logs" (click)="open(l)" style="align-items:flex-start">
    <div class="m-list__body" style="min-width:0">
      <div class="m-list__sub" style="margin:0"><i class="bi bi-clock" aria-hidden="true"></i> {{ l.time }}</div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:var(--m-xs);color:var(--m-text-muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l.preview }}</div>
    </div>
    <i class="bi bi-chevron-right m-list__chev" style="margin-top:3px" aria-hidden="true"></i>
  </div>
</m-panel>

<!-- Drawer JSON -->
<div class="m-scrim" [class.open]="sheetOpen" (click)="close()"></div>
<div class="m-sheet" [class.open]="sheetOpen">
  <div class="m-sheet__grip"></div>
  <div class="m-sheet__head" *ngIf="selected">
    <i class="fa fa-file-code"></i> Detail Log
    <span class="m-subtle" style="font-weight:400;margin-left:6px">{{ selected.time }}</span>
  </div>
  <div class="m-sheet__body" *ngIf="selected">
    <pre class="m-json">{{ selected.pretty }}</pre>
  </div>
</div>
