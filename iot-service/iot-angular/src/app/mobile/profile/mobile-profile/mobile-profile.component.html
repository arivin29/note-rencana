<m-panel tone="theme" label="Profil" icon="bi-person">
  <div class="m-panel__body" style="display:flex;align-items:center;gap:14px">
    <div class="m-brand__mark" style="width:44px;height:44px;margin:0;font-size:16px" aria-hidden="true">{{ initials }}</div>
    <div style="min-width:0">
      <div class="m-list__title">{{ user?.name || 'Pengguna' }}</div>
      <div class="m-list__sub">{{ user?.email }} · {{ user?.role }}</div>
    </div>
  </div>
</m-panel>

<m-panel label="Preferensi" icon="bi-sliders">
  <button type="button" class="m-list__item m-list__item--btn" (click)="openRefreshSheet()">
    <div class="m-list__body"><div class="m-list__title">Muat ulang otomatis</div></div>
    <span class="m-list__sub" style="margin:0 8px 0 0">{{ refreshLabel }}</span>
    <i class="bi bi-chevron-right m-list__chev" aria-hidden="true"></i>
  </button>
</m-panel>

<m-panel label="Tampilan" icon="bi-display">
  <button type="button" class="m-list__item m-list__item--btn" (click)="goDesktop()">
    <div class="m-list__body"><div class="m-list__title">Tampilan Desktop</div></div>
    <i class="bi bi-display m-list__chev" aria-hidden="true"></i>
  </button>
</m-panel>

<m-panel label="Akun" icon="bi-box-arrow-right">
  <button type="button" class="m-list__item m-list__item--btn" (click)="logout()">
    <div class="m-list__body"><div class="m-list__title" style="color:var(--m-danger)">Keluar</div></div>
    <i class="bi bi-box-arrow-right m-list__chev" style="color:var(--m-danger)" aria-hidden="true"></i>
  </button>
</m-panel>

<!-- Sheet: pilih interval auto-reload -->
<div class="m-scrim" [class.open]="refreshSheetOpen" (click)="closeRefreshSheet()"></div>
<div class="m-sheet" [class.open]="refreshSheetOpen">
  <div class="m-sheet__grip"></div>
  <div class="m-sheet__head">Muat ulang otomatis</div>
  <div class="m-subtle" style="padding:0 var(--m-4) 10px">Data perangkat masuk tiap ±2 menit, jadi aplikasi memuat ulang tiap 60 detik saat layar terbuka. Pilih Mati untuk hemat kuota — tarik layar ke bawah untuk memuat ulang manual.</div>
  <div class="m-sheet__body">
    <m-panel>
      <button type="button" class="m-list__item m-list__item--btn" *ngFor="let o of refreshOptions" (click)="selectRefresh(o.value)"
              [attr.aria-pressed]="refreshValue === o.value">
        <div class="m-list__body"><div class="m-list__title">{{ o.label }}</div></div>
        <span class="m-radio" [class.on]="refreshValue === o.value" aria-hidden="true"></span>
      </button>
    </m-panel>
  </div>
</div>
