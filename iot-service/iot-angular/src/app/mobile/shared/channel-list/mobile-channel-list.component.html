<div class="m-card" *ngIf="rows.length > 0">
  <a class="m-chrow m-chrow--link" *ngFor="let c of rows; trackBy: trackById" [routerLink]="c.link"
     [attr.aria-label]="c.title + ', ' + c.valueText + ' ' + c.unit + ', ' + c.statusLabel">
    <div class="m-chrow__top">
      <span class="m-chrow__metric">{{ c.title }}</span>
      <span class="m-chrow__valwrap">
        <span class="m-chrow__valstack">
          <span class="m-chrow__val" [class.m-tx-danger]="c.verdict.isOut">{{ c.valueText }}</span>
          <span class="m-chrow__unit" *ngIf="c.unit">{{ c.unit }}</span>
        </span>
        <i class="fa fa-chevron-right m-list__chev"></i>
      </span>
    </div>
    <div class="m-chrow__mid">
      <span class="m-pill m-pill--xs" [ngClass]="'m-pill--' + c.tone"><span class="dot"></span>{{ c.statusLabel }}</span>
      <span class="m-chrow__subtxt" *ngIf="c.sub">{{ c.sub }}</span>
      <svg class="m-spark-sm" *ngIf="c.spark" [attr.viewBox]="'0 0 ' + sparkW + ' ' + sparkH" preserveAspectRatio="none" aria-hidden="true">
        <path [attr.d]="c.spark"></path>
      </svg>
    </div>
    <div class="m-chrow__sub2">
      <i class="fa fa-clock"></i>
      <span>{{ c.updatedText }} · <span [class.m-tx-dim]="!c.hasThreshold">{{ c.thresholdText }}</span></span>
    </div>
    <div class="m-chrow__out" *ngIf="c.outText"><i class="fa fa-triangle-exclamation"></i> {{ c.outText }}</div>
  </a>
</div>
<div class="m-empty" *ngIf="rows.length === 0"><i class="fa fa-wave-square"></i>{{ emptyText }}</div>
