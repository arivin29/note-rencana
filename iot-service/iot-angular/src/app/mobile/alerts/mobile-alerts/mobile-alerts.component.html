<div class="m-chips">
  <div class="m-chip" [class.active]="filter === 'active'" (click)="setFilter('active')">Aktif</div>
  <div class="m-chip" [class.active]="filter === 'history'" (click)="setFilter('history')">Riwayat</div>
</div>

<div class="m-card" *ngIf="loading" style="padding:var(--m-3)">
  <div class="m-skel" style="width:55%"></div>
  <div class="m-skel" style="width:70%"></div>
  <div class="m-skel" style="width:45%"></div>
</div>

<div class="m-empty" *ngIf="!loading && error">
  <i class="fa fa-triangle-exclamation"></i>{{ error }}
  <div style="margin-top:12px"><button class="m-btn m-btn--ghost m-btn--sm" (click)="load(true)">Coba lagi</button></div>
</div>

<div class="m-empty" *ngIf="!loading && !error && alerts.length === 0">
  <i class="fa fa-bell-slash"></i>
  {{ filter === 'active' ? 'Tidak ada peringatan aktif' : 'Belum ada riwayat' }}
</div>

<div class="m-card" *ngIf="!loading && !error && alerts.length > 0">
  <div class="m-list__item" *ngFor="let a of alerts" (click)="open(a)">
    <div class="m-list__body">
      <div class="m-list__title" style="display:flex;align-items:center;gap:8px">
        <span class="m-pill" [ngClass]="{
          'm-pill--danger': a.sev === 'danger',
          'm-pill--warn': a.sev === 'warn',
          'm-pill--off': a.sev === 'info'
        }"><span class="dot"></span>{{ a.sevLabel }}</span>
        <span style="font-size:var(--m-sm);color:var(--m-text-muted)">{{ a.node }}</span>
      </div>
      <div class="m-list__sub">{{ a.message }}{{ a.metric ? ' · ' + a.metric : '' }} · {{ a.time }}</div>
    </div>
    <i class="fa fa-chevron-right m-list__chev" *ngIf="a.nodeId"></i>
  </div>
</div>
