<div class="m-scadaview" [class.m-scadaview--bare]="embedFullscreen">
  <div class="m-scadaview__bar" *ngIf="!embedFullscreen">
    <button class="m-appbar__back" type="button" (click)="back()" aria-label="Kembali ke Ringkasan" title="Kembali">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <span class="m-scadaview__name">{{ activeName }}</span>
  </div>
  <app-scada-embed class="m-scadaview__frame" [projectId]="projectId" [diagramId]="activeId" mode="view"
    [title]="activeName" (childMessage)="onScadaMessage($event)"></app-scada-embed>
</div>
