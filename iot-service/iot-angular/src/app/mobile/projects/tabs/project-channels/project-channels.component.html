<div class="m-filterbar">
  <div class="m-search">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input type="text" placeholder="Cari alamat / channel / sensor…" aria-label="Cari channel" [ngModel]="search" (ngModelChange)="onSearch($event)">
    <button class="m-iconbtn m-iconbtn--flat" type="button" *ngIf="search" (click)="onSearch('')" aria-label="Hapus pencarian" title="Hapus pencarian">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
  <div class="m-chips m-chips--scroll" role="tablist" aria-label="Filter status channel">
    <button class="m-chip" type="button" role="tab" *ngFor="let o of options" [class.active]="status === o"
            [attr.aria-selected]="status === o" (click)="setStatus(o)">
      {{ label(o) }}<span class="m-chip__n">{{ counts[o] || 0 }}</span>
    </button>
  </div>
</div>

<m-panel *ngIf="s.firstLoad" [pad]="true"><div class="m-skel"></div><div class="m-skel w-50"></div></m-panel>

<m-panel *ngIf="!s.firstLoad && !s.sensors && s.sensorsError" tone="danger">
  <div class="m-empty">
    <i class="bi bi-exclamation-triangle m-tx-danger" aria-hidden="true"></i>{{ s.sensorsError }}
    <div class="m-mt-3"><button class="m-btn m-btn--ghost m-btn--tap" type="button" (click)="retry()">Coba lagi</button></div>
  </div>
</m-panel>

<ng-container *ngIf="!s.firstLoad && s.sensors">
  <div class="m-banner m-banner--warn" *ngIf="s.sensorsError" role="status">
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    <span>Gagal memperbarui<ng-container *ngIf="updated"> · data per {{ updated }}</ng-container></span>
    <button class="m-banner__btn" type="button" (click)="retry()">Coba lagi</button>
  </div>
  <div class="m-banner m-banner--warn" *ngIf="!s.latestAvailable" role="status">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
    <span>Nilai terakhir sedang tidak tersedia dari server — nilai dan status channel tidak ditampilkan.</span>
  </div>

  <div class="m-result-count">
    {{ rows.length }} channel<ng-container *ngIf="rows.length !== total"> · dari {{ total }}</ng-container>
    <ng-container *ngIf="updated"> · diperbarui {{ updated }}</ng-container>
    <ng-container *ngIf="store.trendsError"> · tren 24 jam gagal dimuat</ng-container>
  </div>

  <mobile-channel-list [rows]="rows" [emptyText]="total ? 'Tidak ada channel yang cocok' : 'Belum ada channel aktif di project ini'"></mobile-channel-list>
  <div class="m-spacer"></div>
</ng-container>
