<div class="time-range-picker">
  <button mat-stroked-button [matMenuTriggerFor]="timeMenu" class="time-button">
    <mat-icon>schedule</mat-icon>
    <span>{{ formatTimeRange() }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #timeMenu="matMenu" class="time-menu">
    <button mat-menu-item *ngFor="let preset of presets" 
            (click)="onPresetSelect(preset.value)"
            [class.active]="selectedPreset === preset.value">
      <mat-icon *ngIf="selectedPreset === preset.value">check</mat-icon>
      <span>{{ preset.label }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onPresetSelect('custom')">
      <mat-icon>date_range</mat-icon>
      <span>Custom Range...</span>
    </button>
  </mat-menu>

  <!-- Custom Date Picker Dialog -->
  <div *ngIf="showCustomPicker" class="custom-picker-overlay" (click)="showCustomPicker = false">
    <div class="custom-picker" (click)="$event.stopPropagation()">
      <h6 class="mb-3">Select Custom Range</h6>
      
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label">From</label>
          <input type="datetime-local" class="form-control" [(ngModel)]="customFrom">
        </div>
        <div class="col-6">
          <label class="form-label">To</label>
          <input type="datetime-local" class="form-control" [(ngModel)]="customTo">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button mat-button (click)="showCustomPicker = false">Cancel</button>
        <button mat-raised-button color="primary" (click)="applyCustomRange()">Apply</button>
      </div>
    </div>
  </div>
</div>
