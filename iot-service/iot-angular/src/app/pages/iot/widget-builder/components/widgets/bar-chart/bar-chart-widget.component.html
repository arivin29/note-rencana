<!-- Chart fills the widget body (flex child of .widget-content); the ResizeObserver in the .ts calls resize().
     Never size it from containerHeight minus a fixed header — the header scales with --wb-scale. -->
<div class="chart-wrapper">
  <div echarts 
       [options]="chartOptions" 
       [autoResize]="true" 
       (chartInit)="onChartInit($event)" 
       class="echart">
  </div>
</div>
