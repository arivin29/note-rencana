<div class="widget-wrapper" #widgetWrapper>
  <div class="console-panel" [class.fullscreen]="isFullscreen">
      <!-- Debug: Container Pixel Dimensions -->
      <div *ngIf="debugMode" class="debug-size-badge">
        {{ containerWidth }} x {{ containerHeight }} px
      </div>
      
      <!-- Widget Header - Grafana-compact style -->
      <div class="panel-head d-flex justify-content-between align-items-center">
        <div class="panel-label text-truncate" [title]="widget?.name || 'Widget'">{{ widget?.name || 'Widget' }}</div>
        <div class="dropdown ms-1 flex-shrink-0">
          <button class="icon-button" data-bs-toggle="dropdown">
            <i class="fa fa-ellipsis-v"></i>
          </button>
          <div class="dropdown-menu dropdown-menu-end">
            <a class="dropdown-item" href="javascript:;" (click)="onRefresh()">
              <i class="fa fa-sync-alt fa-fw me-2"></i> Refresh
            </a>
            <a class="dropdown-item" href="javascript:;" (click)="toggleFullscreen.emit()">
              <i class="bi bi-fullscreen fa-fw me-2"></i> Fullscreen
            </a>
            <a class="dropdown-item" href="javascript:;" (click)="duplicate.emit()">
              <i class="fa fa-copy fa-fw me-2"></i> Duplicate
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="javascript:;" (click)="edit.emit()">
              <i class="fa fa-edit fa-fw me-2"></i> Edit Widget
            </a>
            <a class="dropdown-item text-danger" href="javascript:;" (click)="confirmDelete()">
              <i class="fa fa-trash fa-fw me-2"></i> Delete
            </a>
          </div>
        </div>
      </div>

      <!-- Widget Content -->
    <div class="widget-content">
      <!-- Loading State -->
      <div *ngIf="loading" class="text-center py-2">
        <div class="spinner-border spinner-border-sm text-theme" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Error State -->
      <div *ngIf="error && !loading" class="text-center py-2 text-danger small">
        <i class="fa fa-exclamation-triangle mb-1"></i>
        <p class="mb-1 small">{{ error }}</p>
        <button class="btn btn-sm btn-outline-theme btn-xs" (click)="onRefresh()">Retry</button>
      </div>

      <!-- Chart Content -->
      <ng-container *ngIf="!loading && !error && widget">
        <!-- Line Chart -->
        <app-line-chart-widget 
          *ngIf="widget.type === 'line-chart' || widget.type === 'multi-line-chart'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns"
          [containerWidth]="containerWidth"
          [containerHeight]="containerHeight">
        </app-line-chart-widget>

        <!-- Bar Chart -->
        <app-bar-chart-widget 
          *ngIf="widget.type === 'bar-chart'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns"
          [containerWidth]="containerWidth"
          [containerHeight]="containerHeight">
        </app-bar-chart-widget>

        <!-- Gauge -->
        <app-gauge-widget 
          *ngIf="widget.type === 'gauge'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns"
          [containerWidth]="containerWidth"
          [containerHeight]="containerHeight">
        </app-gauge-widget>

        <!-- Pie Chart -->
        <app-pie-chart-widget 
          *ngIf="widget.type === 'pie-chart'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns">
        </app-pie-chart-widget>

        <!-- Stat Card -->
        <app-stat-card-widget 
          *ngIf="widget.type === 'stat-card'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns">
        </app-stat-card-widget>

        <!-- Table -->
        <app-table-widget 
          *ngIf="widget.type === 'table'"
          [widget]="widget"
          [data]="chartData"
          [columns]="columns">
        </app-table-widget>
      </ng-container>
    </div>
  </div>
</div>
