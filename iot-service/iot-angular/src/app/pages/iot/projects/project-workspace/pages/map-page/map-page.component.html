<div class="map-page">
  <div class="map-header">
    <h5 class="mb-0">
      <i class="fa fa-map-marked-alt me-2 text-theme"></i>
      Node Locations
    </h5>
    <div class="map-actions">
      <span class="badge bg-body text-muted border me-2">
        {{ nodes.length }} nodes with location
      </span>
      <button class="btn btn-sm btn-outline-default" (click)="loadNodes()">
        <i class="fa fa-sync-alt" [class.fa-spin]="loading"></i>
      </button>
    </div>
  </div>
  
  <div class="map-container">
    <!-- Loading -->
    <div *ngIf="loading" class="map-loading">
      <div class="spinner-border text-theme"></div>
      <span>Loading nodes...</span>
    </div>
    
    <!-- Map Widget -->
    <div class="map-wrapper" *ngIf="!loading">
      <iot-project-map-widget 
        [nodes]="mapWidgetNodes">
      </iot-project-map-widget>
    </div>
    
    <!-- No nodes message -->
    <div *ngIf="!loading && nodes.length === 0" class="no-nodes">
      <i class="fa fa-map-marker-alt fa-3x mb-3 opacity-50"></i>
      <div>No nodes with location data</div>
      <small class="text-muted">Add coordinates to your nodes to see them on the map</small>
    </div>
  </div>
  
  <!-- Legend -->
  <div class="map-legend" *ngIf="!loading && nodes.length > 0">
    <div class="legend-item">
      <span class="status-dot status-online"></span>
      <span>Online</span>
    </div>
    <div class="legend-item">
      <span class="status-dot status-warning"></span>
      <span>Warning</span>
    </div>
    <div class="legend-item">
      <span class="status-dot status-offline"></span>
      <span>Offline</span>
    </div>
  </div>
</div>
