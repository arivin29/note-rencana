<div class="sensor-page-wrapper">
  <app-sensor-chanel-detail 
    *ngIf="sensorId && nodeId" 
    [inputChannelId]="sensorId"
    [inputNodeId]="nodeId"
    [embedded]="true">
  </app-sensor-chanel-detail>

  <div *ngIf="!sensorId" class="text-center py-5 text-muted">
    <i class="fa fa-spinner fa-spin fa-2x mb-3"></i>
    <p>Loading sensor detail...</p>
  </div>
</div>
