<div class="d-flex flex-wrap align-items-center gap-2 mb-3">
  <div class="me-auto">
    <ul class="breadcrumb mb-1">
      <li class="breadcrumb-item">IoT</li>
      <li class="breadcrumb-item"><a routerLink="/iot/owners">PDAM / Owner</a></li>
      <li class="breadcrumb-item active">{{ breadcrumbTitle }}</li>
    </ul>
    <h1 class="page-header mb-0">{{ pageTitle }}</h1>
  </div>
  <div class="d-flex align-items-center gap-2">
    <a [routerLink]="backLink" class="btn btn-sm btn-outline-default">Kembali</a>
  </div>
</div>

<!-- Loading -->
<div *ngIf="loadingData" class="text-center py-5">
  <div class="spinner-border spinner-border-sm text-theme" role="status"><span class="visually-hidden">Memuat…</span></div>
  <div class="mt-2 text-muted small">Memuat data owner…</div>
</div>

<!-- Load error -->
<div *ngIf="loadError && !loadingData" class="alert alert-danger d-flex align-items-center">
  <i class="fa fa-exclamation-triangle me-2"></i>
  <span>{{ loadError }}</span>
  <button class="btn btn-sm btn-outline-danger ms-auto" (click)="loadOwner(ownerId!)" *ngIf="ownerId">Coba lagi</button>
</div>

<form [formGroup]="ownerForm" (ngSubmit)="submitOwner()" *ngIf="!loadingData && !loadError">
  <div *ngIf="error" class="alert alert-danger d-flex align-items-center mb-3" role="alert">
    <i class="fa fa-exclamation-circle me-2"></i>
    <span>{{ error }}</span>
    <button type="button" class="btn-close ms-auto" (click)="error = null" aria-label="Tutup"></button>
  </div>

  <card>
    <card-header class="fw-semibold">Profil owner</card-header>
    <card-body>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="of-name">Nama owner <span class="text-danger">*</span></label>
          <input id="of-name" class="form-control" placeholder="mis. PDAM Tirta Mahakam" formControlName="name"
            [class.is-invalid]="hasError('name', 'required')">
          <div class="invalid-feedback">Nama wajib diisi.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="of-industry">Industri <span class="text-danger">*</span></label>
          <select id="of-industry" class="form-select" formControlName="industry" [class.is-invalid]="hasError('industry', 'required')">
            <option value="" disabled>Pilih industri…</option>
            <option *ngFor="let option of industryOptions" [value]="option">{{ option }}</option>
          </select>
          <div class="invalid-feedback">Industri wajib dipilih.</div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="of-pic">Contact person <span class="text-danger">*</span></label>
          <input id="of-pic" class="form-control" formControlName="contactPerson"
            [class.is-invalid]="hasError('contactPerson', 'required')">
          <div class="invalid-feedback">Contact person wajib diisi.</div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="of-email">Email</label>
          <input id="of-email" type="email" class="form-control" formControlName="email"
            [class.is-invalid]="hasError('email', 'email')">
          <div class="invalid-feedback">Format email tidak valid.</div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="of-phone">Telepon</label>
          <input id="of-phone" class="form-control" formControlName="phone">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="of-sla">Tingkat SLA</label>
          <select id="of-sla" class="form-select" formControlName="slaLevel">
            <option value="">Belum diatur</option>
            <option *ngFor="let sla of slaLevels" [value]="sla">{{ sla }}</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="of-address">Alamat</label>
          <textarea id="of-address" class="form-control" rows="2" formControlName="address"></textarea>
        </div>
      </div>
      <div class="text-muted small mt-3"><i class="fa fa-info-circle fa-fw me-1"></i>Forwarding data ke sistem PDAM belum tersedia.</div>
    </card-body>
  </card>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <a [routerLink]="backLink" class="btn btn-outline-default">Batal</a>
    <button type="submit" class="btn btn-theme" [disabled]="saving">
      <i class="fa fa-fw me-1" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
      {{ saving ? 'Menyimpan…' : (isEditMode ? 'Simpan perubahan' : 'Simpan owner') }}
    </button>
  </div>
</form>
