<div class="d-flex align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h2 class="mb-0">Installation Profiles</h2>
    <div class="text-muted small">Field instalasi per profil (Pipa / Tandon / Elektrik / Kualitas). Sensor mewarisi profil dari jenis channel-nya.</div>
  </div>
  <div class="ms-auto">
    <button class="btn btn-outline-default" (click)="load()" [disabled]="loading">
      <i class="fa fa-rotate-right me-1" [class.fa-spin]="loading"></i> Refresh
    </button>
  </div>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
<div *ngIf="loading" class="text-center py-5 text-muted"><i class="fa fa-spinner fa-spin fa-2x"></i></div>

<div class="row g-3" *ngIf="!loading">
  <div class="col-xl-3 col-md-6" *ngFor="let p of profiles">
    <card class="h-100 shadow-sm">
      <card-body class="p-4 d-flex flex-column">
        <div class="d-flex align-items-center mb-2">
          <div class="w-40px h-40px rounded-3 bg-theme bg-opacity-25 d-flex align-items-center justify-content-center me-2">
            <i [class]="iconFor(p.code)" class="text-theme"></i>
          </div>
          <div>
            <div class="fw-semibold">{{ p.name }}</div>
            <div class="text-muted small font-monospace">{{ p.code }}</div>
          </div>
        </div>
        <div class="text-muted small flex-1">{{ p.description }}</div>
        <button class="btn btn-outline-theme btn-sm mt-3" (click)="openFields(p)">
          <i class="fa fa-sliders me-1"></i> Edit Fields
        </button>
      </card-body>
    </card>
  </div>
  <div class="col-12" *ngIf="!profiles.length">
    <div class="text-center text-muted py-5 border rounded-3">No installation profiles.</div>
  </div>
</div>

<app-profile-fields-drawer [isOpen]="drawerOpen" [profile]="activeProfile" (close)="closeDrawer()">
</app-profile-fields-drawer>
