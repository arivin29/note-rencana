<div class="card h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <div class="text-muted text-uppercase small">Node Health Trends</div>
        <div class="fw-semibold">{{ ownerId ? 'Tenant View' : 'Global View' }}</div>
      </div>
      <span class="badge bg-light text-theme">{{ timeRange }}</span>
    </div>
<div *ngIf="loading" class="text-center text-muted small py-4">
      <span class="spinner-border spinner-border-sm me-2"></span>Memuat data...
    </div>
    <div *ngIf="!loading && error" class="text-center text-muted small py-4">
      <i class="fa fa-exclamation-triangle fa-fw me-1"></i>{{ error }}
      <div class="mt-2"><button type="button" class="btn btn-sm btn-outline-default" (click)="loadData()">Coba lagi</button></div>
    </div>
    <ng-container *ngIf="!loading && !error">
    <div class="text-center text-muted small py-3">
      <i class="fa fa-chart-line fa-fw me-1"></i>Riwayat belum tersedia
    </div>
    <div class="row text-center mt-3">
      <div class="col" *ngFor="let summary of statusSummary">
        <div class="text-muted text-uppercase small">{{ summary.label }}</div>
        <div class="fw-bold" [ngClass]="summary.class">{{ summary.value }}</div>
      </div>
    </div>
    </ng-container>
  </div>
</div>
