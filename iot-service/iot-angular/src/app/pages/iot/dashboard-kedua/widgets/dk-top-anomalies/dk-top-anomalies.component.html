<div class="card h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <div class="text-muted text-uppercase small">Top Anomalies</div>
        <div class="fw-semibold">Sensors requiring attention</div>
      </div>
      <span class="badge bg-light text-theme">{{ timeRange }}</span>
    </div>
<div *ngIf="loading" class="text-center text-muted small py-4">
      <span class="spinner-border spinner-border-sm me-2"></span>Memuat data...
    </div>
    <div *ngIf="!loading && error" class="text-center text-muted small py-4">
      <i class="fa fa-exclamation-triangle fa-fw me-1"></i>{{ error }}
      <div class="mt-2"><button type="button" class="btn btn-sm btn-outline-default" (click)="loadData()">Coba lagi</button></div>
    </div>
<div *ngIf="!loading && !error && !anomalies.length" class="text-center text-muted small py-4">
      <i class="fa fa-inbox fa-fw me-1"></i>Belum ada anomali
    </div>
    <div class="list-group list-group-flush" *ngIf="!loading && !error">
      <div class="list-group-item px-0" *ngFor="let anomaly of anomalies">
        <div class="d-flex justify-content-between">
          <div>
            <div class="fw-semibold">{{ anomaly.sensor }}</div>
            <div class="text-muted small">{{ anomaly.location }} • {{ anomaly.lastTriggered }}</div>
          </div>
          <div class="text-end">
            <span class="badge" [ngClass]="anomaly.severity === 'critical' ? 'bg-danger' : 'bg-warning text-dark'">
              {{ anomaly.severity | titlecase }}
            </span>
            <div class="small text-muted">{{ anomaly.occurrences }} events</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
