<div class="card h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between mb-3">
      <div>
        <div class="text-muted text-uppercase small">Recent Activities</div>
        <div class="fw-semibold">Operational timeline</div>
      </div>
      <span class="badge bg-light text-theme">{{ timeRange }}</span>
    </div>
<div *ngIf="loading" class="text-center text-muted small py-4">
      <span class="spinner-border spinner-border-sm me-2"></span>Memuat data...
    </div>
    <div *ngIf="!loading && error" class="text-center text-muted small py-4">
      <i class="fa fa-exclamation-triangle fa-fw me-1"></i>{{ error }}
      <div class="mt-2"><button type="button" class="btn btn-sm btn-outline-default" (click)="loadData()">Coba lagi</button></div>
    </div>
<div *ngIf="!loading && !error && !activities.length" class="text-center text-muted small py-4">
      <i class="fa fa-inbox fa-fw me-1"></i>Belum ada aktivitas
    </div>
    <ul class="timeline" *ngIf="!loading && !error">
      <li *ngFor="let activity of activities">
        <span class="timeline-badge" [ngClass]="badgeClass(activity.type)"></span>
        <div class="timeline-panel">
          <div class="fw-semibold">{{ activity.title }}</div>
          <div class="text-muted small">{{ activity.description }}</div>
          <div class="small text-muted">{{ activity.timestamp }}</div>
        </div>
      </li>
    </ul>
  </div>
</div>
